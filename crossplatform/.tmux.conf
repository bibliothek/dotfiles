# Tmux Configuration

# Set prefix key (optional, default is C-b)
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# Enable mouse support
set -g mouse on

set -g base-index 0
setw -g pane-base-index 0

# Renumber windows when one is closed
set -g renumber-windows on

# Auto-rename window to current directory name
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Increase scrollback buffer size
set -g history-limit 10000

# Enable true color (24-bit)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",alacritty:Tc"
set -ga terminal-overrides ",wezterm:Tc"

# New panes/windows open in current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ----------------------------
# Pane Navigation (Alt + hjkl)
# ----------------------------
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-j select-pane -D
bind -n M-k select-pane -U

# ----------------------------
# Pane Resizing (Ctrl + Alt + hjkl)
# ----------------------------
bind -n C-M-h resize-pane -L 5
bind -n C-M-l resize-pane -R 5
bind -n C-M-j resize-pane -D 5
bind -n C-M-k resize-pane -U 5

# ----------------------------
# Window Navigation (Alt + Shift + h/l)
# ----------------------------
bind -n M-H previous-window
bind -n M-L next-window

# ----------------------------
# Pane Splitting (Alt + s/d)
# ----------------------------
bind -n M-s split-window -c "#{pane_current_path}"
bind -n M-d split-window -h -c "#{pane_current_path}"

# ----------------------------
# Pane Closing (Alt + w)
# ----------------------------
bind -n M-w kill-pane

# ----------------------------------------------------
# Hint-key selection of URLs/paths/SHAs (tmux-fingers)
# ----------------------------------------------------
# Installed as a binary by unix-setup (apps/required/tmux.sh), not by tpm.
if-shell 'command -v tmux-fingers >/dev/null 2>&1' "run 'tmux-fingers load-config'"
